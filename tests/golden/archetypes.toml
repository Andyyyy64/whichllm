# Golden ranking set: hardware archetypes and the constraints their
# recommendations must satisfy. See tests/golden/harness.py for how each
# constraint kind is evaluated and scripts/update_golden.py to refresh.
#
# Constraints describe what a good recommendation must (not) look like,
# never an exact ordering. `draft = true` marks constraints that still need
# a maintainer's review. `xfail` maps "<archetype>/<profile>" to the reason a
# constraint is known to fail today; the tests treat those as strict xfails,
# so fixing the bug turns them into failures until the entry is removed.

