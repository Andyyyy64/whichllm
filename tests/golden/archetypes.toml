# Golden ranking set: hardware archetypes and the constraints their
# recommendations must satisfy. See tests/golden/harness.py for how each
# constraint kind is evaluated and scripts/update_golden.py to refresh.
#
# Constraints describe what a good recommendation must (not) look like,
# never an exact ordering. `xfail` maps "<archetype>/<profile>" to the reason
# a constraint is known to fail today; the tests treat those as strict xfails,
# so fixing the bug turns them into failures until the entry is removed.
# `archetypes` and the xfail keys are fnmatch patterns.
#
# ram_bandwidth_gbps is system RAM bandwidth (89.6 = dual-channel DDR5-5600).
# Without it the default dual-channel DDR4-3200 (51.2) applies, and Apple
# GPUs use their unified-memory bandwidth.

