# --- Constraints -------------------------------------------------------------

[[constraint]]
id = "nonempty"
kind = "nonempty"
profiles = ["general", "coding", "vision", "math", "any"]
rationale = "Every archetype gets runnable recommendations."

[[constraint]]
id = "no-pretrain-only"
kind = "never_in_top"
top = 10
profiles = ["general", "coding", "vision", "math", "any"]
rationale = """Pretrain-only checkpoints (Base, -pt, base Llama/Qwen2.5/Mistral/
Gemma) are not chat models and must never be recommended. The patterns are the
known base checkpoints in the frozen catalog, kept apart from the code that
detects them."""
patterns = [
    '(?i)-base(-\d+)?(-GGUF)?$',
    '-pt$',
    '^meta-llama/Llama-3\.\d-\d+B$',
    '^allenai/Olmo-3-1025-7B$',
    '^mistralai/Mistral-7B-v0\.\d$',
    '^Qwen/Qwen2\.5-\d+(\.\d+)?B$',
    'Qwen2\.5-Coder-\d+(\.\d+)?B(-GGUF)?$',
    '^google/gemma-2b$',
    '^google/gemma-4-31B$',
    '^HuggingFaceTB/SmolLM2-135M$',
]

[[constraint]]
id = "no-auxiliary-models"
kind = "never_in_top"
top = 10
profiles = ["general", "coding", "vision", "math", "any"]
rationale = """Speculative-decoding draft heads run only next to their target
model, and diffusion language models need their own sampler. Neither is
something to chat with."""
patterns = ['(?i)diffusion', '(?i)dflash']

[[constraint]]
id = "no-test-fixtures"
kind = "never_in_top"
top = 50
profiles = ["general", "coding", "vision", "math", "any"]
rationale = """CI fixtures have huge download counts and no use, so they must not
appear anywhere in the list."""
patterns = ['(?i)tiny-random', '-internal-testing/']

[[constraint]]
id = "tiny-is-a-size"
kind = "any_in_top"
top = 30
archetypes = ["m1-8gb-mac", "cpu-16gb-win"]
rationale = """Ling-3.0-tiny is a real 8B model with direct benchmarks. A name
rule meant for fixtures must not hide it from the list."""
patterns = ['(?i)ling-3\.0-tiny']

[[constraint]]
id = "qwen25-not-top1"
kind = "never_in_top"
top = 1
min_gpu_memory_gb = 12
rationale = """Qwen2.5 is two generations old. On 12 GB and up a newer model
fits, so Qwen2.5 must not be the #1 pick (HN launch thread, #104)."""
patterns = ['(?i)qwen2\.5']

[[constraint]]
id = "no-stale-generation"
kind = "stale_generation"
top = 5
profiles = ["general", "coding", "any"]
rationale = """When a newer official generation of the same line is runnable,
an older generation must not sit near the top. "Newer" only counts official
releases, so a renamed community fine-tune cannot satisfy it (andy's decision
of 2026-10-29)."""
pairs = [
    { old = '(?i)qwen2\.5-(?!coder)', new = '^Qwen/Qwen3\.[568]-' },
    { old = '(?i)qwen2\.5-coder', new = '^Qwen/Qwen3-Coder-' },
    { old = '(?i)gemma-2-', new = '^google/gemma-[34]-' },
    { old = '(?i)phi-3', new = '(?i)^microsoft/phi-4' },
    { old = '(?i)qwen3\.[56]-27b', new = '^Qwen/Qwen3\.8-27B$' },
    { old = '(?i)qwen3\.5-35b-a3b', new = '^Qwen/Qwen3\.6-35B-A3B$' },
    { old = '(?i)qwen3-30b-a3b', new = '^Qwen/Qwen3\.[56]-35B-A3B$' },
    { old = '(?i)gemma-3-', new = '^google/gemma-4-' },
]

[[constraint]]
id = "older-generation-noted"
kind = "older_noted"
profiles = ["general", "coding"]
rationale = """Only the newest generation of a line gets a row, and that row
names what it replaced (andy's decision of 2026-10-29)."""
pairs = [
    { old = '^Qwen/Qwen3\.6-27B$', new = '^Qwen/Qwen3\.8-27B$' },
    { old = '^Qwen/Qwen3\.5-35B-A3B$', new = '^Qwen/Qwen3\.6-35B-A3B$' },
]

[[constraint]]
id = "top3-usable-speed"
kind = "top_speed"
top = 3
min_tok_per_sec = 7.0
profiles = ["general", "coding", "vision", "math", "any"]
rationale = """The top 3 must be usable, whatever the placement. The bar is
8 tok/s (#76, #104; andy's decision of 2026-10-29), as far as the machine has
that many candidates that fast. The check allows 1 tok/s because the bar is soft
in the score and the estimates are not that exact: on real file sizes the
strongest CPU picks land at 7.5-7.7 tok/s, and CPU estimates run about 40% under
a measured run. Replacing them with a toy model at 29 tok/s would be worse."""

[[constraint]]
id = "measured-qwen36-35b-expert-offload"
kind = "row_within"
archetypes = ["rtx5080-16gb-win"]
quant = "Q4_K_M"
patterns = ['^Qwen/Qwen3\.6-35B-A3B$']
min_tok_per_sec = 59.0
max_tok_per_sec = 109.0
rationale = """Measured on an RTX 5080 with llama-server b11977: 88-93 tok/s
with experts in RAM, 99.9 under Ollama. The estimate may stay 35% under that
and 20% over it, which is how far a change can move the speed model before
someone has to measure again."""

[[constraint]]
id = "measured-qwen38-27b-full-gpu"
kind = "row_within"
archetypes = ["rtx5080-16gb-win"]
quant = "Q3_K_M"
patterns = ['^Qwen/Qwen3\.8-27B$']
min_tok_per_sec = 36.0
max_tok_per_sec = 66.0
min_required_gb = 12.0
max_required_gb = 15.0
rationale = """Measured on an RTX 5080: 55.4 tok/s on the GPU, 12.8 GiB of
VRAM. The speed bound allows 35% under the run and 20% over it. The estimate is
14.2 GiB with the real file, since it keeps 500 MB of overhead and a wider
activation margin than this run needed."""

[[constraint]]
id = "measured-qwen35-2b-cpu"
kind = "row_within"
archetypes = ["cpu-64gb-ddr5-win"]
quant = "Q4_K_M"
patterns = ['^Qwen/Qwen3\.5-2B$']
min_tok_per_sec = 20.0
max_tok_per_sec = 42.0
rationale = """Measured on the same machine with llama-server -ngl 0: 34.7
tok/s on 24 cores and dual-channel DDR5-5600. CPU estimates run about 40% low
today, so the lower bound sits just under that and the upper bound stays 20%
over the measurement."""

[[constraint]]
id = "memory-bandwidth-caps-speed"
kind = "bandwidth_ceiling"
gpu = true
profiles = ["general", "coding", "vision", "math", "any"]
rationale = """A dense model reads all its weights for every token, so a full-GPU
estimate cannot pass memory bandwidth divided by the file size. Real runs stay
under it too: 349 of 738 tok/s for a 2B and 55 of 85 for a 27B on an RTX 5080.
This holds on the machines nobody here has measured, such as Macs."""

[[constraint]]
id = "kv-grows-with-context"
kind = "row_within"
archetypes = ["rtx4090-24gb-linux-128k"]
quant = "Q3_K_M"
patterns = ['^Qwen/Qwen3\.8-27B$']
min_required_gb = 18.0
max_required_gb = 25.0
rationale = """At 128K the KV cache from config.json is about 8.6 GB on top of
the 11.3 GB of weights, so the same GGUF needs far more than at 4K (#76, #104)."""

[[constraint]]
id = "full-gpu-keeps-headroom"
kind = "full_gpu_budget"
archetypes = ["gtx*", "rtx*", "rx*", "arc-*", "2x-*", "mixed-*"]
max_gpu_fraction = 0.95
profiles = ["general", "coding", "vision", "math", "any"]
rationale = """A full-GPU row leaves the driver and the desktop their share: at
least 5% of VRAM stays free, so a near-edge fit is not promised."""

[[constraint]]
id = "metal-working-set"
kind = "full_gpu_budget"
archetypes = ["*-mac"]
max_gpu_fraction = 0.75
profiles = ["general", "coding"]
rationale = """Metal gives the GPU at most about 3/4 of unified memory by
default, so a Mac full-GPU row must fit that, not the size on the box (#152)."""

[[constraint]]
id = "offload-keeps-ram-free"
kind = "ram_budget"
archetypes = ["gtx*", "rtx*", "rx*", "arc-*", "2x-*", "mixed-*", "cpu-*"]
max_ram_fraction = 0.85
rationale = """What does not fit the GPU goes to system RAM, and the OS keeps at
least 15% of that for itself (#51)."""

[[constraint]]
id = "gguf-only-backends"
kind = "gguf_only"
archetypes = ["*-win", "*-win-32k", "*-mac", "cpu-*", "rx*", "arc-*"]
profiles = ["general", "coding", "vision", "math", "any"]
rationale = """AWQ, GPTQ and NVFP4 checkpoints run through vLLM, which needs
Linux and NVIDIA. Everywhere else every row must be a GGUF."""

[[constraint]]
id = "top-picks-launch"
kind = "runnable"
top = 3
profiles = ["general", "coding", "vision", "math", "any"]
rationale = """`whichllm run` launches the first row it can resolve to a real
file, so the top rows must resolve for `run` to agree with the table. The frozen
catalog has no GGUF upload for granite-4.0-h-tiny."""
xfail = { "cpu-16gb-win/general" = "no granite-4.0-h-tiny GGUF in the catalog" }

[[constraint]]
id = "memory-buys-quality"
kind = "quant_in"
top = 1
archetypes = [
    "rtx4090-24gb-linux",
    "rtx5090-32gb-linux",
    "2x-rtx3090-48gb-linux",
    "m3max-36gb-mac",
    "m4max-*",
]
quants = ["Q5_K_M", "Q6_K", "Q8_0"]
profiles = ["general", "coding"]
rationale = """With memory and speed to spare the #1 pick must not sit at Q3
for extra tokens per second nobody needs."""

[[constraint]]
id = "task-scores-rank-the-profile"
kind = "task_evidence"
top = 5
min_rows = 3
profiles = ["coding", "vision"]
rationale = """A task profile ranks on that task's benchmarks, not on the
general score (#217)."""

[[constraint]]
id = "vision-needs-vision-models"
kind = "never_in_top"
top = 10
profiles = ["vision"]
rationale = """--profile vision must not fill up with text-only models, however
strong they are in general."""
patterns = [
    '(?i)gpt-oss',
    '(?i)glm-\d\.\d-flash',
    '(?i)phi-4',
    '(?i)qwen3-(next|coder|\d)',
    '(?i)deepseek-(v4|r1)',
]

[[constraint]]
id = "no-tiny-models-12gb"
kind = "min_params"
min_gpu_memory_gb = 12
min_params_b = 6.0
rationale = """On 12 GB and up the general list has room for real models, so
3-4B toys stay out of the top 10."""

[[constraint]]
id = "coding-modern-top5"
kind = "any_in_top"
top = 5
profiles = ["coding"]
min_gpu_memory_gb = 12
rationale = """On 12 GB and up the coding top 5 should include a current
coding-capable model."""
patterns = [
    '(?i)devstral',
    '(?i)gpt-oss',
    '(?i)qwen3\.[68]-',
    '(?i)qwen3-coder',
]

[[constraint]]
id = "coding-not-name-gated"
kind = "any_in_top"
top = 10
profiles = ["coding"]
min_gpu_memory_gb = 12
rationale = """Strong general models that code well (gpt-oss, Devstral,
Qwen3.6/3.8-27B) belong in the coding top 10, whatever their names say. The
profile used to admit only repos with "coder" and similar words in them (#76)."""
patterns = ['(?i)gpt-oss', '(?i)devstral', '^Qwen/Qwen3\.[68]-27B$']

[[constraint]]
id = "qwen38-top3-24gb"
kind = "any_in_top"
top = 3
min_gpu_memory_gb = 24
rationale = """Qwen3.8-27B is the newest dense 27B and fits 24 GB+, at 128K too.
It must be in the top 3 there."""
patterns = ['^Qwen/Qwen3\.8-27B$']

[[constraint]]
id = "moe-offload-16gb"
kind = "any_in_top"
top = 5
archetypes = ["rtx5060ti-16gb-64gb-linux"]
placement = "expert_offload"
rationale = """With 16 GB VRAM and 64 GB RAM a large MoE with experts in RAM
(gpt-oss-120b, Qwen3.6-35B-A3B) is the strongest practical option and should
reach the top 5."""
patterns = ['(?i)gpt-oss-120b', '(?i)qwen3\.[68]-35b-a3b']

[[constraint]]
id = "expert-offload-small-gpu"
kind = "any_in_top"
top = 3
archetypes = ["rtx2060-6gb-win", "rtx4060-8gb-win", "rtx3060-12gb-win"]
placement = "expert_offload"
rationale = """On a small card a 26-35B MoE with experts in RAM still runs fast
and beats anything that fits the card, so it must not lose to a full-GPU
bonus or a partial-offload penalty (#76, #105, #208)."""

[[constraint]]
id = "multi-gpu-pools-memory"
kind = "any_in_top"
top = 5
archetypes = ["2x-rtx3090-48gb-linux"]
fit_type = "full_gpu"
min_required_gb = 25.0
rationale = """Two 24 GB cards pool for a layer split, so a model no single card
holds can still run fully on the GPUs (#112)."""
